<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Helvetica, Arial, sans-serif">
  <!-- every pair of points; the circles are the pairs each labeling puts together (not to scale) -->
  <rect x="5" y="5" width="630" height="350" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
  <text x="20" y="32" font-size="15" font-weight="bold" fill="#222222">all pairs: N = C(n, 2)</text>
  <text x="20" y="50" font-size="12" fill="#555555">(worked example: n = 6 points, N = 15)</text>

  <circle cx="250" cy="195" r="115" fill="#4C78A8" fill-opacity="0.22" stroke="#4C78A8" stroke-width="2"/>
  <circle cx="390" cy="195" r="115" fill="#F58518" fill-opacity="0.22" stroke="#F58518" stroke-width="2"/>
  <text x="190" y="72" font-size="14" font-weight="bold" fill="#2E5A88" text-anchor="middle">together in U: A (6)</text>
  <text x="450" y="72" font-size="14" font-weight="bold" fill="#B35F0C" text-anchor="middle">together in V: B (3)</text>

  <text x="195" y="186" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">A − T = 4</text>
  <text x="195" y="205" font-size="11" fill="#333333" text-anchor="middle">together in U,</text>
  <text x="195" y="219" font-size="11" fill="#333333" text-anchor="middle">apart in V</text>

  <text x="320" y="186" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">T = 2</text>
  <text x="320" y="205" font-size="11" fill="#333333" text-anchor="middle">together</text>
  <text x="320" y="219" font-size="11" fill="#333333" text-anchor="middle">in both</text>

  <text x="447" y="186" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">B − T = 1</text>
  <text x="447" y="205" font-size="11" fill="#333333" text-anchor="middle">together in V,</text>
  <text x="447" y="219" font-size="11" fill="#333333" text-anchor="middle">apart in U</text>

  <text x="320" y="333" font-size="13" fill="#222222" text-anchor="middle">outside both circles, apart in both: <tspan font-weight="bold">N − A − B + T</tspan> = 15 − 6 − 3 + 2 = 8</text>
</svg>
